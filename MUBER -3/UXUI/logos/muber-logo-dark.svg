<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <title>Muber Logo — Versión Fondo Oscuro</title>
  <desc>Logo MUBER para fondo negro/oscuro. Tipografía Barlow Condensed Black.</desc>

  <!-- Fondo negro -->
  <rect width="480" height="120" rx="16" fill="#0A0A0A"/>

  <!-- Ícono: caja ámbar redondeada -->
  <rect x="24" y="16" width="88" height="88" rx="18" fill="#F5A800"/>

  <!-- Barra superior (negro) -->
  <rect x="36" y="34" width="48" height="12" rx="6" fill="#0A0A0A"/>

  <!-- Barra inferior (negro semitransparente) -->
  <rect x="36" y="52" width="32" height="12" rx="6" fill="#0A0A0A" opacity="0.4"/>

  <!-- Flecha chevron (negro) -->
  <polyline points="88,30 104,60 88,90" stroke="#0A0A0A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Wordmark MU (blanco) -->
  <text
    x="128"
    y="84"
    font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif"
    font-weight="800"
    font-size="72"
    letter-spacing="-1"
    fill="#FFFFFF">MU</text>

  <!-- Wordmark BER (ámbar) -->
  <text
    x="270"
    y="84"
    font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif"
    font-weight="800"
    font-size="72"
    letter-spacing="-1"
    fill="#F5A800">BER</text>

  <!-- Tagline -->
  <text
    x="129"
    y="104"
    font-family="'Barlow', Arial, sans-serif"
    font-weight="600"
    font-size="11"
    letter-spacing="3"
    fill="#FFFFFF"
    opacity="0.35">LOGÍSTICA · MUDANZAS</text>
</svg>
