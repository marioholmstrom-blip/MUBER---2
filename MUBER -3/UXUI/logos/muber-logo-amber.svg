<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <title>Muber Logo — Versión Fondo Ámbar</title>
  <desc>Logo MUBER para fondo ámbar de alto impacto. Tipografía Barlow Condensed Black.</desc>

  <!-- Fondo ámbar -->
  <rect width="480" height="120" rx="16" fill="#F5A800"/>

  <!-- Ícono: caja negra redondeada -->
  <rect x="24" y="16" width="88" height="88" rx="18" fill="#0A0A0A"/>

  <!-- Barra superior (ámbar) -->
  <rect x="36" y="34" width="48" height="12" rx="6" fill="#F5A800"/>

  <!-- Barra inferior (blanca semitransparente) -->
  <rect x="36" y="52" width="32" height="12" rx="6" fill="#FFFFFF" opacity="0.4"/>

  <!-- Flecha chevron (ámbar) -->
  <polyline points="88,30 104,60 88,90" stroke="#F5A800" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Wordmark MU (negro) -->
  <text
    x="128"
    y="84"
    font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif"
    font-weight="800"
    font-size="72"
    letter-spacing="-1"
    fill="#0A0A0A">MU</text>

  <!-- Wordmark BER (blanco) -->
  <text
    x="270"
    y="84"
    font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif"
    font-weight="800"
    font-size="72"
    letter-spacing="-1"
    fill="#FFFFFF">BER</text>

  <!-- Tagline -->
  <text
    x="129"
    y="104"
    font-family="'Barlow', Arial, sans-serif"
    font-weight="600"
    font-size="11"
    letter-spacing="3"
    fill="#0A0A0A"
    opacity="0.45">LOGÍSTICA · MUDANZAS</text>
</svg>
