version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --prefix landings --ignore-scripts --no-audit --no-fund
    build:
      commands:
        - npm run build --prefix landings
        - node scripts/build-public-site.mjs
  artifacts:
    baseDirectory: web-dist
    files:
      - '**/*'
  cache:
    paths:
      - landings/node_modules/**/*
      - landings/.next/cache/**/*
