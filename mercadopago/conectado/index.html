<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A192F" />
  <title>Cuenta Mercado Pago conectada | MUBER</title>
  <style>
    :root {
      --azul: #0A192F;
      --ocre: #D4A373;
      --verde: #10B981;
      --naranja: #E67E22;
      --texto: #1F2937;
      --texto-claro: #4B5563;
      --gris-claro: #F9FAFB;
      --gris-borde: #E5E7EB;
      --blanco: #FFFFFF;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% 0%, rgba(212, 163, 115, 0.18), transparent 38%),
        linear-gradient(180deg, var(--azul) 0%, #102846 100%);
      color: var(--texto);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 440px);
      padding: 28px 24px 24px;
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: 24px;
      background: var(--blanco);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      text-align: center;
    }

    .logo {
      display: block;
      width: min(220px, 72%);
      height: auto;
      margin: 0 auto 24px;
    }

    .success-icon {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--verde);
      color: var(--blanco);
      font-size: 40px;
      font-weight: 800;
      line-height: 1;
      box-shadow: 0 12px 28px rgba(16, 185, 129, 0.28);
    }

    h1 {
      margin: 0 0 12px;
      color: var(--azul);
      font-size: clamp(26px, 8vw, 34px);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .message {
      margin: 0 auto 22px;
      color: var(--texto-claro);
      font-size: 16px;
      line-height: 1.55;
    }

    .status {
      margin: 0 0 18px;
      padding: 13px 14px;
      border: 1px solid rgba(16, 185, 129, 0.28);
      border-radius: 14px;
      background: rgba(16, 185, 129, 0.08);
      color: #087a57;
      font-size: 14px;
      font-weight: 700;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      background: var(--naranja);
      color: var(--blanco);
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(230, 126, 34, 0.24);
    }

    button:hover { filter: brightness(0.96); }
    button:focus-visible { outline: 3px solid var(--ocre); outline-offset: 3px; }
    button:active { transform: translateY(1px); }

    .countdown {
      margin: 15px 0 0;
      color: var(--texto-claro);
      font-size: 14px;
    }

    .countdown strong { color: var(--azul); }

    @media (max-width: 360px) {
      main { padding: 24px 18px 20px; border-radius: 20px; }
      .success-icon { width: 64px; height: 64px; font-size: 35px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>

    <h1 id="success-title">Cuenta Mercado Pago conectada</h1>
    <p class="message">
      La autorización fue completada correctamente. Tu cuenta quedó vinculada a la postulación de chofer.
    </p>
    <p class="status" role="status">Volverás al mismo paso del formulario con la cuenta conectada.</p>
    <button id="return-button" type="button">Volver a MUBER</button>
    <p class="countdown" aria-live="polite">
      Regreso automático en <strong><span id="seconds">10</span> segundos</strong>.
    </p>
  </main>

  <script>
    (() => {
      const button = document.getElementById("return-button");
      const seconds = document.getElementById("seconds");
      let remaining = 10;
      let returning = false;

      const returnToMuber = () => {
        if (returning) return;
        returning = true;
        button.disabled = true;
        button.textContent = "Volviendo a MUBER…";

        window.close();

        window.setTimeout(() => {
          if (document.visibilityState === "visible") {
            window.history.back();
          }
        }, 250);
      };

      button.addEventListener("click", returnToMuber);

      const countdown = window.setInterval(() => {
        remaining -= 1;
        seconds.textContent = String(Math.max(remaining, 0));

        if (remaining <= 0) {
          window.clearInterval(countdown);
          returnToMuber();
        }
      }, 1000);
    })();
  </script>
