<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>MUBER | Mercado Pago</title>
  <style>
    :root {
      color-scheme: light;
      --muber-navy: #0a192f;
      --muber-gold: #efb52e;
      --mp-blue: #00b1ea;
      --ink: #17263a;
      --muted: #65758a;
      --line: #dfe7ef;
      --surface: #ffffff;
      --canvas: #f3f7fa;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% 0, rgba(0, 177, 234, .16), transparent 38%),
        linear-gradient(180deg, #eef9fd 0%, var(--canvas) 48%, #ffffff 100%);
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .shell { width: min(100%, 430px); }
    .brands {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .brands::after {
      content: "";
      width: 1px;
      height: 32px;
      background: #c9d7e3;
      order: 2;
    }
    .muber-logo {
      order: 1;
      display: block;
      width: 154px;
      height: auto;
    }
    .mp-brand {
      order: 3;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #243041;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }
    .mp-brand img { width: 38px; height: 38px; }
    .card {
      overflow: hidden;
      border: 1px solid rgba(10, 25, 47, .1);
      border-radius: 26px;
      background: var(--surface);
      box-shadow: 0 24px 60px rgba(10, 25, 47, .16);
    }
    .accent { height: 8px; background: linear-gradient(90deg, var(--muber-gold) 0 42%, var(--mp-blue) 42% 100%); }
    .content { padding: 30px 24px 26px; text-align: center; }
    .status-icon {
      width: 66px;
      height: 66px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e6f8ff;
      color: var(--mp-blue);
    }
    .status-icon svg { width: 31px; height: 31px; }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--mp-blue);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: var(--muber-navy);
      font-size: clamp(26px, 8vw, 32px);
      line-height: 1.08;
      letter-spacing: -.035em;
    }
    .message {
      margin: 16px auto 0;
      max-width: 330px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }
    .primary-action {
      width: 100%;
      min-height: 54px;
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: var(--mp-blue);
      color: #ffffff;
      font-size: 16px;
      font-weight: 850;
      text-decoration: none;
      box-shadow: 0 12px 26px rgba(0, 177, 234, .24);
    }
    .return-copy {
      margin: 19px 0 0;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muber-navy);
      font-size: 14px;
      font-weight: 750;
      line-height: 1.45;
    }
    @media (max-width: 370px) {
      .brands { gap: 10px; }
      .muber-logo { width: 132px; }
      .mp-brand { font-size: 13px; gap: 6px; }
      .mp-brand img { width: 32px; height: 32px; }
      .content { padding-inline: 20px; }
    }
  </style>
</head>
<body>
  <main class="shell" id="result-card">
    <div class="brands" aria-label="MUBER y Mercado Pago">
      <img class="muber-logo" src="./muber-logo.png" alt="MUBER">
      <div class="mp-brand"><img src="./mercadopago.svg" alt="">Mercado Pago</div>
    </div>
    <section class="card" aria-live="polite">
      <div class="accent"></div>
      <div class="content">
        <div class="status-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path>
          </svg>
        </div>
        <p class="eyebrow" id="eyebrow">Conecta tu cuenta</p>
        <h1 id="title">¿No tienes cuenta Mercado Pago?</h1>
        <p class="message" id="message">Puedes crear una cuenta en Mercado Pago y luego volver a MUBER para conectarla.</p>
        <a class="primary-action" href="https://www.mercadopago.cl/hub/registration/landing" rel="noopener noreferrer">Crear cuenta Mercado Pago</a>
        <p class="return-copy" id="return-copy">Vuelve a MUBER e intenta conectar tu cuenta nuevamente.</p>
      </div>
    </section>
  </main>
</body>
</html>
